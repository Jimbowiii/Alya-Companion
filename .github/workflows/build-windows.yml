name: Build & Release Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build Alya Companion
        run: npm run tauri build

      - name: Prepare deterministic release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null

          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Installateur NSIS introuvable"
          }

          $target = "release/Alya-Companion-Windows-x64-setup.exe"
          Copy-Item $installer.FullName $target -Force

          $stream = [System.IO.File]::OpenRead($target)
          try {
            $sha256 = [System.Security.Cryptography.SHA256]::Create()
            try {
              $hashBytes = $sha256.ComputeHash($stream)
              $hash = ([System.BitConverter]::ToString($hashBytes)).Replace("-", "").ToLowerInvariant()
            } finally {
              $sha256.Dispose()
            }
          } finally {
            $stream.Dispose()
          }

          "$hash  Alya-Companion-Windows-x64-setup.exe" | Set-Content "release/Alya-Companion-Windows-x64-setup.exe.sha256" -Encoding ascii
          Write-Host "Installateur prepare : $target"
          Write-Host "SHA-256 : $hash"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alya-Companion-Windows
          path: release/*

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/Alya-Companion-Windows-x64-setup.exe
            release/Alya-Companion-Windows-x64-setup.exe.sha256
      - name: Announce release on Discord
        if: success()
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_THREAD_ID: ${{ secrets.DISCORD_THREAD_ID }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DISCORD_WEBHOOK_URL)) {
            throw "DISCORD_WEBHOOK_URL est vide ou introuvable."
          }

          if ([string]::IsNullOrWhiteSpace($env:DISCORD_THREAD_ID)) {
            throw "DISCORD_THREAD_ID est vide ou introuvable."
          }

          $separator = if ($env:DISCORD_WEBHOOK_URL.Contains("?")) { "&" } else { "?" }
          $webhookUrl = "$env:DISCORD_WEBHOOK_URL${separator}thread_id=$env:DISCORD_THREAD_ID"

          $releaseUrl = "$env:SERVER_URL/$env:REPOSITORY/releases/tag/$env:RELEASE_TAG"
          $downloadUrl = "$env:SERVER_URL/$env:REPOSITORY/releases/download/$env:RELEASE_TAG/Alya-Companion-Windows-x64-setup.exe"

          $payload = @{
            username = "Alya Companion"

            embeds = @(
              @{
                title = "Nouvelle version d'Alya Companion disponible !"
                description = "La version **$env:RELEASE_TAG** vient d'etre publiee."
                color = 7506394

                fields = @(
                  @{
                    name = "Telechargement"
                    value = "[Telecharger Alya Companion]($downloadUrl)"
                    inline = $false
                  },
                  @{
                    name = "Details"
                    value = "[Voir la release GitHub]($releaseUrl)"
                    inline = $false
                  }
                )

                footer = @{
                  text = "Alya Companion"
                }
              }
            )
          }

          $json = $payload | ConvertTo-Json -Depth 10

          Invoke-RestMethod `
            -Uri $webhookUrl `
            -Method Post `
            -ContentType "application/json" `
            -Body $json

          Write-Host "Annonce Discord envoyee dans le post Forum existant."
