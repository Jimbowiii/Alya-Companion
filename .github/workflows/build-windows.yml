name: Build & Release Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build Alya Companion
        run: npm run tauri build

      - name: Prepare deterministic release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installateur NSIS introuvable" }
          $target = "release/Alya-Companion-Windows-x64-setup.exe"

          $stream = [System.IO.File]::OpenRead($target)
          try {
            $sha256 = [System.Security.Cryptography.SHA256]::Create()
            try {
              $hashBytes = $sha256.ComputeHash($stream)
              $hash = ([System.BitConverter]::ToString($hashBytes)).Replace("-", "").ToLowerInvariant()
            } finally {
              $sha256.Dispose()
            }
          } finally {
            $stream.Dispose()
          }

          "$hash  Alya-Companion-Windows-x64-setup.exe" | Set-Content "release/Alya-Companion-Windows-x64-setup.exe.sha256" -Encoding ascii
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" "release/" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alya-Companion-Windows
          path: release/*

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/Alya-Companion-Windows-x64-setup.exe
            release/Alya-Companion-Windows-x64-setup.exe.sha256
