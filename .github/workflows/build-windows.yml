name: Build & Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Read changelog
        id: changelog
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:RELEASE_TAG -replace '^v', ''
          $body = $null

          if (Test-Path "CHANGELOG.md") {
            $content = Get-Content "CHANGELOG.md" -Raw -Encoding utf8
            $lines = $content -split "`r?`n"
            $escapedVersion = [regex]::Escape($version)
            $headingPattern = "^\s*##\s+\[?$escapedVersion\]?(?:\s*-\s*.*)?\s*$"

            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match $headingPattern) {
                $start = $i
                break
              }
            }

            if ($start -ge 0) {
              $end = $lines.Count
              for ($i = $start + 1; $i -lt $lines.Count; $i++) {
                if ($lines[$i] -match '^\s*##\s+') {
                  $end = $i
                  break
                }
              }

              if ($end -gt ($start + 1)) {
                $body = ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
              }
            }
          }

          # Secours : la release ne doit plus echouer uniquement parce que la section
          # du CHANGELOG est absente. Les notes versionnees sont utilisees a la place.
          if ([string]::IsNullOrWhiteSpace($body)) {
            $releaseNotesPath = "RELEASE-NOTES-$version.md"
            if (Test-Path $releaseNotesPath) {
              Write-Warning "CHANGELOG section $version missing; using $releaseNotesPath instead."
              $body = (Get-Content $releaseNotesPath -Raw -Encoding utf8).Trim()
            }
          }

          if ([string]::IsNullOrWhiteSpace($body)) {
            Write-Host "Available changelog headings:"
            if (Test-Path "CHANGELOG.md") {
              Get-Content "CHANGELOG.md" -Encoding utf8 |
                Where-Object { $_ -match '^\s*##\s+' } |
                ForEach-Object { Write-Host "  $_" }
            }
            throw "No release notes found for version $version."
          }

          Write-Host "Release notes found for $version"
          Write-Host $body

          $delimiter = "CHANGELOG_$([guid]::NewGuid().ToString('N'))"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "body<<$delimiter" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value $body -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value $delimiter -Encoding utf8

      - name: Build and publish ALYA Companion
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ALYA Companion ${{ github.ref_name }}"
          releaseBody: ${{ steps.changelog.outputs.body }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: "Alya-Companion-Windows-x64[setup][ext]"

      - name: Copy updater metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force updater-meta | Out-Null

          Write-Host "Downloading latest.json from release $env:RELEASE_TAG"
          gh release download $env:RELEASE_TAG `
            --pattern "latest.json" `
            --dir updater-meta `
            --clobber

          if (-not (Test-Path "updater-meta/latest.json")) {
            throw "latest.json was not generated by tauri-action."
          }

          gh release view updater-metadata *> $null
          $metadataReleaseExists = $LASTEXITCODE -eq 0

          if (-not $metadataReleaseExists) {
            Write-Host "Creating updater-metadata release"
            gh release create updater-metadata `
              --title "ALYA Companion Updater Metadata" `
              --notes "Metadata utilisé par le système de mise à jour intégré d'ALYA Companion." `
              --prerelease
          }

          Write-Host "Uploading latest.json to updater-metadata"

          gh release upload updater-metadata `
            "updater-meta/latest.json" `
            --clobber

      - name: Announce release on Discord
        if: success()
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_THREAD_ID: ${{ secrets.DISCORD_THREAD_ID }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          CHANGELOG_BODY: ${{ steps.changelog.outputs.body }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:DISCORD_WEBHOOK_URL)) {
            throw "DISCORD_WEBHOOK_URL is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:DISCORD_THREAD_ID)) {
            throw "DISCORD_THREAD_ID is missing."
          }

          $separator = if ($env:DISCORD_WEBHOOK_URL.Contains("?")) {
            "&"
          } else {
            "?"
          }

          $webhookUrl = "$env:DISCORD_WEBHOOK_URL${separator}thread_id=$env:DISCORD_THREAD_ID"
          $releaseUrl = "$env:SERVER_URL/$env:REPOSITORY/releases/tag/$env:RELEASE_TAG"
          $downloadUrl = "$env:SERVER_URL/$env:REPOSITORY/releases/download/$env:RELEASE_TAG/Alya-Companion-Windows-x64-setup.exe"

          $changelog = $env:CHANGELOG_BODY

          if ([string]::IsNullOrWhiteSpace($changelog)) {
            $changelog = "Aucun détail fourni pour cette version."
          }

          $maxChangelogLength = 1600
          if ($changelog.Length -gt $maxChangelogLength) {
            $changelog = $changelog.Substring(0, $maxChangelogLength)
            $changelog += "`n`n… **Changelog tronqué sur Discord.** Consulte la GitHub Release pour lire la suite."
          }

          $description = @"
          **$env:RELEASE_TAG** est maintenant disponible ! 🌺

          ### 📋 Changelog

          $changelog
          "@

          $payload = @{
            username = "ALYA Companion"
            embeds = @(
              @{
                title = "🌺 Nouvelle version d'ALYA Companion disponible !"
                description = $description
                fields = @(
                  @{
                    name = "📥 Téléchargement"
                    value = "[Télécharger ALYA Companion]($downloadUrl)"
                    inline = $true
                  },
                  @{
                    name = "🔗 GitHub Release"
                    value = "[Voir la release complète]($releaseUrl)"
                    inline = $true
                  }
                )
                footer = @{
                  text = "ALYA Companion • PokeMMO Companion"
                }
              }
            )
          }

          $json = $payload | ConvertTo-Json -Depth 10

          Invoke-RestMethod `
            -Uri $webhookUrl `
            -Method Post `
            -ContentType "application/json; charset=utf-8" `
            -Body ([System.Text.Encoding]::UTF8.GetBytes($json))
