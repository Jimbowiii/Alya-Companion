name: Reannounce RC12 Discord Direct

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate Discord secrets
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_THREAD_ID: ${{ secrets.DISCORD_THREAD_ID }}
        run: |
          test -n "$DISCORD_WEBHOOK_URL" || { echo "DISCORD_WEBHOOK_URL manquant"; exit 1; }
          test -n "$DISCORD_THREAD_ID" || { echo "DISCORD_THREAD_ID manquant"; exit 1; }
          echo "Discord secrets presents."

      - name: Validate announcer syntax
        run: node --check .github/scripts/announce-release.mjs

      - name: Announce RC12 on Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_THREAD_ID: ${{ secrets.DISCORD_THREAD_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: https://api.github.com
          GITHUB_REF_NAME: v1.0.0-rc.12
          RELEASE_TAG: v1.0.0-rc.12
        run: node .github/scripts/announce-release.mjs
