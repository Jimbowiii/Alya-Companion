[package]
name = "alya-companion"
version = "1.0.0-rc.12"
description = "A lightweight companion for AlyArchetype, Surf patches and vanity previews."
authors = ["ALYA Companion"]
edition = "2021"

[lib]
name = "alya_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
ctr = "0.9"
aes = "0.8"
base64 = "0.22"
regex = "1"
tauri = { version = "2.12.3", features = ["unstable"] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-shell = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
zip = "2.4"
tempfile = "3"
sysinfo = "0.37"
url = "2"
semver = "1"
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
tauri-plugin-notification = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
